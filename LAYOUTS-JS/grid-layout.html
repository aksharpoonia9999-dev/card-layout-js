<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRID-JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-poppins: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body>
    <script>
      const body = document.body;
      body.classList.add("font-poppins");

      // section
      const section = document.createElement("section");
      section.classList.add("min-h-fit", "px-4");
      body.appendChild(section);

      // container
      const container = document.createElement("div");
      container.classList.add(
        "container",
        "max-w-[1320px]",
        "w-full",
        "mx-auto",
      );
      section.appendChild(container);

      // row
      const row = document.createElement("div");
      row.classList.add(
        "row",
        "w-full",
        "py-[40px]",
        "md:py-[60px]",
        "flex",
        "items-center",
        "justify-center",
        "flex-col",
      );
      container.appendChild(row);

      // button - to add images and stuff ;-;

      const button = document.createElement("button");
      button.innerText = "Add Your Image";
      button.classList.add(
        "max-w-[300px]",
        "w-full",
        "h-[60px]",
        "text-white",
        "rounded-full",
        "cursor-pointer",
        "font-bold",
        "bg-black",
        "border",
        "border-solid",
        "border-transparent",
        "transition-all",
        "duration-500",
        "ease-in-out",
      );

      button.addEventListener("click", () => {
        button.classList.remove("bg-black", "text-white", "border-transparent");

        button.classList.add("bg-white", "text-black", "border-black");

        setTimeout(() => {
          button.classList.remove("bg-white", "text-black", "border-black");

          button.classList.add("bg-black", "text-white", "border-transparent");
        }, 500);
      });
      row.appendChild(button);

      // ADD RANDOM IMAGE FROM 16 IMG

      button.addEventListener("click", () => {
        // Pick a random image from imgData

        const randomIndex = Math.floor(Math.random() * imgData.length);

        const randomImage = imgData[randomIndex];

        // Create new card

        const newCard = document.createElement("div");

        newCard.classList.add(
          "card",
          "max-w-[312px]",
          "w-full",
          "rounded-[30px]",
          "h-[348px]",
        );

        // Add image

        newCard.innerHTML = `
    <img
      class="
        w-full
        object-cover
        h-[348px]
        rounded-[30px]
        cursor-pointer
      "
      width="312"
      height="348"
      src="${randomImage.img}"
      alt="post-img"
    >
  `;

        // Add card to grid

        gridContainer.appendChild(newCard);
      });

      // grid-container

      const gridContainer = document.createElement("div");
      gridContainer.classList.add(
        "grid-container",
        "w-full",
        "grid",
        "grid-cols-4",
        "mt-10",
        "gap-x-6",
        "gap-y-[34px]",
      );
      row.appendChild(gridContainer);

      // IMAGES DATA :>

      const imgData = [
        {
          img: "/LAYOUTS-JS/images-grid/post-1.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-2.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-3.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-4.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-5.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-6.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-7.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-8.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-9.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-10.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-11.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-12.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-13.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-14.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-15.webp",
        },
        {
          img: "/LAYOUTS-JS/images-grid/post-16.webp",
        },
      ];

      //MAPPPPPPPPPPP :DDD

      gridContainer.innerHTML = imgData
        .map(
          (
            item,
          ) => `<div class="card max-w-[312px] w-full rounded-[30px] h-[348px">
        <img class="w-full object-cover h-[348px] rounded-[30px] cursor-pointer" width="312" height="348"  src="${item.img}" alt="post-img">
    </div>`,
        )
        .join("");

      // MODAL :(

      const modalPhoto = "/LAYOUTS-JS/images-grid/modal-image.png";

      // 4 USER IMAGES

      const userImages = [
        "/LAYOUTS-JS/images-grid/user-1.png",
        "/LAYOUTS-JS/images-grid/user-2.png",
        "/LAYOUTS-JS/images-grid/user-3.png",
        "/LAYOUTS-JS/images-grid/user-4.png",
      ];

      // SCROLLBAR

      const modalStyle = document.createElement("style");

      modalStyle.innerHTML = `
  .comments-list::-webkit-scrollbar {
    width: 8px;
  }

  .comments-list::-webkit-scrollbar-track {
    background: transparent;
  }

  .comments-list::-webkit-scrollbar-thumb {
    background: black;
    min-height: 92px;
  }

  .comments-list {
    scrollbar-width: thin;
    scrollbar-color: black transparent;
  }
`;

      document.head.appendChild(modalStyle);

      // MODAL OVERLAY

      const modal = document.createElement("div");

      modal.classList.add(
        "fixed",
        "inset-0",
        "z-[999]",
        "hidden",
        "items-center",
        "justify-center",
        "bg-black/70",
        "p-4",
      );

      document.body.appendChild(modal);

      // MODAL BOX

      const modalBox = document.createElement("div");

      modalBox.classList.add(
        "relative",
        "w-full",
        "max-w-[1320px]",
        "h-[716px]",
        "bg-white",
        "flex",
        "items-center",
        "gap-[26px]",
        "pt-[33px]",
        "pb-[34px]",
        "pl-[33px]",
        "pr-[31px]",
        "border",
        "border-solid",
        "border-black/20",
      );

      modalBox.style.boxShadow = "0px 38px 85px -19px rgba(0, 0, 0, 0.25)";

      modal.appendChild(modalBox);

      // CLOSE BUTTON

      const closeButton = document.createElement("button");

      closeButton.innerHTML = `
  <svg
    width="17"
    height="17"
    viewBox="0 0 17 17"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      d="M14.3167 0L8.33333 5.98333L2.35 0L0 2.35L5.98333 8.33333L0 14.3167L2.35 16.6667L8.33333 10.6833L14.3167 16.6667L16.6667 14.3167L10.6833 8.33333L16.6667 2.35L14.3167 0Z"
      fill="black"
    />
  </svg>
`;

      closeButton.classList.add(
        "absolute",
        "-top-[17px]",
        "-right-[17px]",
        "z-20",
        "w-[50px]",
        "h-[50px]",
        "rounded-full",
        "bg-white",
        "flex",
        "items-center",
        "justify-center",
        "cursor-pointer",
        "transition-all",
        "duration-300",
        "hover:rotate-90",
      );

      closeButton.style.boxShadow = "0px 5px 20px 0px rgba(0, 0, 0, 0.25)";

      modalBox.appendChild(closeButton);

      // MODAL IMAGE

      const modalImageWrapper = document.createElement("div");

      modalImageWrapper.classList.add(
        "w-[687px]",
        "h-[652px]",
        "shrink-0",
        "overflow-hidden",
      );

      modalBox.appendChild(modalImageWrapper);

      // MODAL IMAGE

      const modalImage = document.createElement("img");

      modalImage.src = modalPhoto;

      modalImage.alt = "Modal Image";

      modalImage.classList.add("w-full", "h-full", "object-cover");

      modalImageWrapper.appendChild(modalImage);

      // COMMENTS SIDE

      const commentsPanel = document.createElement("div");

      commentsPanel.classList.add(
        "flex-1",
        "min-w-0",
        "h-[652px]",
        "flex",
        "flex-col",
        "bg-[#FAFAFA]",
        "border",
        "border-solid",
        "border-black/10",
        "p-[20px]",
      );

      modalBox.appendChild(commentsPanel);

      // TOP ACTIONS

      const actions = document.createElement("div");

      actions.classList.add(
        "flex",
        "items-center",
        "justify-between",
        "pb-[20px]",
      );

      commentsPanel.appendChild(actions);

      // LEFT ACTIONS

      const leftActions = document.createElement("div");

      leftActions.classList.add("flex", "items-center", "gap-[24px]");

      actions.appendChild(leftActions);

      // LIKE BUTTON

      const likeButton = document.createElement("button");

      likeButton.classList.add(
        "group",
        "flex",
        "items-center",
        "gap-[8px]",
        "cursor-pointer",
        "text-black",
        "transition-all",
        "duration-300",
        "hover:text-red-500",
      );

      likeButton.innerHTML = `
  <svg
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      d="M7 3C4.239 3 2 5.216 2 7.95C2 10.157 2.875 15.395 11.488 20.69C11.6423 20.7839 11.8194 20.8335 12 20.8335C12.1806 20.8335 12.3577 20.7839 12.512 20.69C21.125 15.395 22 10.157 22 7.95C22 5.216 19.761 3 17 3C14.239 3 12 6 12 6C12 6 9.761 3 7 3Z"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="fill-transparent transition-all duration-300 group-hover:fill-current"
    />
  </svg>

  <span class="text-[18px] leading-none">
    10
  </span>
`;

      leftActions.appendChild(likeButton);

      // COMMENT BUTTON

      const commentButton = document.createElement("button");

      commentButton.classList.add(
        "flex",
        "items-center",
        "gap-[8px]",
        "cursor-pointer",
        "text-black",
        "transition-all",
        "duration-300",
        "hover:text-blue-500",
      );

      commentButton.innerHTML = `
  <svg
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      d="M14 19C17.771 19 19.657 19 20.828 17.828C22 16.657 22 14.771 22 11C22 7.229 22 5.343 20.828 4.172C19.657 3 17.771 3 14 3H10C6.229 3 4.343 3 3.172 4.172C2 5.343 2 7.229 2 11C2 14.771 2 16.657 3.172 17.828C3.825 18.482 4.7 18.771 6 18.898"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M14 19C12.764 19 11.402 19.5 10.159 20.145C8.161 21.182 7.162 21.701 6.67 21.37C6.178 21.04 6.271 20.015 6.458 17.966L6.5 17.5"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />
  </svg>

  <span class="text-[18px] leading-none">
    20
  </span>
`;

      leftActions.appendChild(commentButton);

      // SHARE BUTTON

      const shareButton = document.createElement("button");

      shareButton.classList.add(
        "cursor-pointer",
        "text-black",
        "transition-all",
        "duration-300",
        "hover:text-green-500",
      );

      shareButton.innerHTML = `
  <svg
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      d="M17.5 22C16.9662 22.0062 16.4382 21.8888 15.9574 21.657C15.4765 21.4251 15.0558 21.0852 14.7282 20.6638C14.4006 20.2423 14.1749 19.7508 14.0689 19.2276C13.9629 18.7044 13.9793 18.1638 14.117 17.648L7.85697 14.07C7.3289 14.5538 6.6649 14.8637 5.9549 14.9576C5.24489 15.0515 4.52317 14.925 3.88746 14.5951C3.25175 14.2653 2.73276 13.748 2.40077 13.1134C2.06877 12.4788 1.93981 11.7576 2.03134 11.0472C2.12287 10.3369 2.43048 9.67188 2.9125 9.14218C3.39453 8.61247 4.02769 8.2437 4.72625 8.08577C5.42481 7.92785 6.15504 7.98841 6.81804 8.25926C7.48104 8.53011 8.0448 8.99816 8.43297 9.60003L14.116 6.35103C14.0425 6.07321 14.0035 5.78739 14 5.50003C13.993 4.68826 14.266 3.89889 14.7729 3.26483C15.2799 2.63077 15.9898 2.19074 16.7832 2.01885C17.5766 1.84696 18.405 1.95369 19.1289 2.32109C19.8528 2.68848 20.428 3.29409 20.7576 4.03594C21.0873 4.7778 21.1512 5.61058 20.9387 6.39407C20.7262 7.17757 20.2502 7.86391 19.5909 8.33753C18.9316 8.81116 18.1292 9.04314 17.3189 8.99442C16.5086 8.9457 15.7398 8.61924 15.142 8.07003L8.99197 11.585C8.98497 11.845 8.94897 12.102 8.88297 12.353L15.143 15.93C15.562 15.5455 16.0684 15.2691 16.6185 15.1246C17.1685 14.9802 17.7455 14.9722 18.2993 15.1012C18.8531 15.2303 19.3671 15.4926 19.7966 15.8653C20.2262 16.238 20.5583 16.7098 20.7641 17.2399C20.9699 17.7701 21.0433 18.3424 20.9779 18.9073C20.9124 19.4722 20.7101 20.0126 20.3885 20.4816C20.0669 20.9506 19.6357 21.334 19.1323 21.5986C18.629 21.8632 18.0686 22.001 17.5 22ZM17.5 17C17.1021 17 16.7206 17.1581 16.4393 17.4394C16.158 17.7207 16 18.1022 16 18.5C16 18.8979 16.158 19.2794 16.4393 19.5607C16.7206 19.842 17.1021 20 17.5 20C17.8978 20 18.2793 19.842 18.5606 19.5607C18.8419 19.2794 19 18.8979 19 18.5C19 18.1022 18.8419 17.7207 18.5606 17.4394C18.2793 17.1581 17.8978 17 17.5 17ZM5.49997 10C5.10215 10 4.72062 10.1581 4.43931 10.4394C4.15801 10.7207 3.99997 11.1022 3.99997 11.5C3.99997 11.8979 4.15801 12.2794 4.43931 12.5607C4.72062 12.842 5.10215 13 5.49997 13C5.8978 13 6.27933 12.842 6.56063 12.5607C6.84194 12.2794 6.99997 11.8979 6.99997 11.5C6.99997 11.1022 6.84194 10.7207 6.56063 10.4394C6.27933 10.1581 5.8978 10 5.49997 10ZM17.5 4.00003C17.303 4.00003 17.1079 4.03883 16.9259 4.11421C16.744 4.18959 16.5786 4.30008 16.4393 4.43937C16.3 4.57866 16.1895 4.74401 16.1142 4.926C16.0388 5.10799 16 5.30305 16 5.50003C16 5.69701 16.0388 5.89206 16.1142 6.07405C16.1895 6.25604 16.3 6.4214 16.4393 6.56069C16.5786 6.69998 16.744 6.81047 16.9259 6.88585C17.1079 6.96123 17.303 7.00003 17.5 7.00003C17.8978 7.00003 18.2793 6.84199 18.5606 6.56069C18.8419 6.27938 19 5.89785 19 5.50003C19 5.1022 18.8419 4.72067 18.5606 4.43937C18.2793 4.15806 17.8978 4.00003 17.5 4.00003Z"
      fill="currentColor"
    />
  </svg>
`;

      actions.appendChild(shareButton);

      // COMMENTS TITLE

      const commentsTitle = document.createElement("h3");

      commentsTitle.innerText = "Comments";

      commentsTitle.classList.add(
        "text-[16px]",
        "leading-none",
        "font-medium",
        "text-black",
        "mb-[15px]",
      );

      commentsPanel.appendChild(commentsTitle);

      // COMMENTS DATA — 24 COMMENTS (why 24 - to match that scrollbar width and stuff which i still did not make perfect ;-;)

      const commentsData = Array.from({ length: 24 }, () => ({
        name: "Jhone Doe",
        comment: "Pulvinar viverra ac mauris magna lobortis ultricies.",
      }));

      // SCROLLABLE COMMENTS LIST

      const commentsList = document.createElement("div");

      commentsList.classList.add(
        "comments-list",
        "flex-1",
        "overflow-y-auto",
        "pr-[17px]",
        "gap-[21px]",
        "flex",
        "flex-col",
      );

      commentsPanel.appendChild(commentsList);

      // CREATE COMMENT CARDS

      commentsList.innerHTML = commentsData
        .map(
          (comment, index) => `
        <div
          class="
            flex
            items-start
            rounded-[4px]
          "
        >
       
          <img
            src="${userImages[index % 4]}"
            alt="${comment.name}"
            class="
              w-[32px]
              h-[32px]
              shrink-0
              rounded-full
              object-cover
            "
          >

   
          <div
            class="
            comment-card
            px-[17px]
            py-3
            rounded-tr-[10px]
            rounded-br-[10px]
            rounded-bl-[10px]
              ml-[14px]
              flex
              flex-col
              gap-[8px]
              min-w-0
              bg-white
            "
          >
            <h4
              class="
                text-[18px]
                leading-none
                font-medium
                text-black
              "
            >
              ${comment.name}
            </h4>

            <p
              class="
                text-[18px]
                leading-none
                text-black opacity-60
                mt-[9px]
              "
            >
              ${comment.comment}
            </p>
          </div>
        </div>
      `,
        )
        .join("");

      // COMMENT CARD SHADOW

      document.querySelectorAll(".comment-card").forEach((card) => {
        card.style.boxShadow = "0px 5px 10px 0px rgba(0, 0, 0, 0.05)";
      });

      // OPEN MODAL

      gridContainer.addEventListener("click", (event) => {
        if (event.target.matches(".card img")) {
          modalImage.src = modalPhoto;

          modal.classList.remove("hidden");
          modal.classList.add("flex");

          document.body.classList.add("overflow-hidden");
        }
      });

      // CLOSE MODAL

      function closeModal() {
        modal.classList.add("hidden");

        modal.classList.remove("flex");

        document.body.classList.remove("overflow-hidden");
      }

      // CLOSE BUTTON

      closeButton.addEventListener("click", closeModal);

      // CLICK OUTSIDE

      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          closeModal();
        }
      });

      // ESC KEY

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeModal();
        }
      });
    </script>
  </body>
</html>
